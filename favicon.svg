<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Noxta Studio — N lettermark</title>
  <desc>Dark rounded square with a stylised N lettermark in full cyan-to-violet-to-pink Aurora gradient</desc>
  <defs>
    <!-- Full Aurora gradient: cyan → violet → pink at 135deg -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7ce0ff"/>
      <stop offset="50%"  stop-color="#b08cff"/>
      <stop offset="100%" stop-color="#ff8cc5"/>
    </linearGradient>
    <!-- Subtle glow fill for background blooms -->
    <radialGradient id="glow-tl" cx="25%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#7ce0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ce0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br" cx="75%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#ff8cc5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff8cc5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" rx="72" fill="#05060e"/>

  <!-- Subtle border using Aurora gradient -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="71" fill="none" stroke="url(#aurora)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Atmospheric corner glows -->
  <circle cx="80"  cy="80"  r="80" fill="url(#glow-tl)"/>
  <circle cx="320" cy="320" r="80" fill="url(#glow-br)"/>

  <!-- N lettermark — bold geometric, full Aurora gradient -->
  <!-- Left stem -->
  <rect x="80" y="96" width="52" height="208" rx="6" fill="url(#aurora)"/>
  <!-- Right stem -->
  <rect x="268" y="96" width="52" height="208" rx="6" fill="url(#aurora)"/>
  <!-- Diagonal crossbar — top-left to bottom-right -->
  <polygon points="132,96 188,96 268,304 212,304" fill="url(#aurora)"/>
</svg>
