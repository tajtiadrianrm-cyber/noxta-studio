    <style>
:root {
  --bg: #0a0a0a;
  --bg-soft: #121414;
  --bg-tint: #1a1c1c;
  --ink: #f5f6f7;
  --ink-soft: #cfcccb;
  --mute: #8a8786;
  --hairline: rgba(255, 255, 255, 0.08);
  --accent: linear-gradient(100deg, #ff7a3d 0%, #ff4d15 50%, #d63a0d 100%);
  --accent-solid: #ff4d15;
  --f-display: "Orbitron", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", monospace;
  --pad-x: clamp(20px, 5vw, 40px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
  min-height: 100dvh;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px var(--pad-x);
  position: relative;
  isolation: isolate;
}

/* Ambient orange glows */
body::before,
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}
body::before {
  background:
    radial-gradient(ellipse 60% 50% at 12% 18%, rgba(255, 122, 61, 0.18), transparent 60%),
    radial-gradient(ellipse 50% 60% at 88% 82%, rgba(214, 58, 13, 0.15), transparent 60%);
}
body::after {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.4;
  mix-blend-mode: screen;
}

.card-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.card-wrap::before,
.card-wrap::after {
  content: "+";
  position: absolute;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--accent-solid);
  line-height: 1;
}
.card-wrap::before { top: -28px; left: -8px; }
.card-wrap::after  { bottom: -28px; right: -8px; }

.logo {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 32px;
  letter-spacing: -0.01em;
  text-decoration: none;
  color: var(--ink);
  display: inline-flex;
  align-items: baseline;
}
.logo .x {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-style: italic;
  padding: 0 1px;
}

.logo-rule {
  width: 56px;
  height: 1px;
  background: var(--accent);
  margin: 18px 0 28px;
}

.name {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(34px, 7vw, 48px);
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  text-align: center;
}

.role {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
  margin-top: 14px;
}

.divider {
  width: 100%;
  height: 1px;
  background: var(--hairline);
  margin: 36px 0 24px;
}

.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link {
  --mx: 50%;
  --my: 50%;
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: var(--bg-soft);
  color: var(--ink);
  text-decoration: none;
  box-shadow: inset 0 0 0 1px var(--hairline);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  overflow: hidden;
  transition:
    transform 280ms cubic-bezier(.2,.7,.2,1),
    box-shadow 280ms cubic-bezier(.2,.7,.2,1),
    background-color 280ms;
}
.link::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    260px circle at var(--mx, 50%) var(--my, 50%),
    rgba(255, 77, 21, 0.20),
    rgba(255, 77, 21, 0) 70%
  );
  opacity: 0;
  transition: opacity 240ms cubic-bezier(.2,.7,.2,1);
  z-index: 1;
  mix-blend-mode: screen;
}
.link > * { position: relative; z-index: 2; }
.link:hover {
  transform: translateY(-3px);
  background-color: rgba(255, 77, 21, 0.04);
  box-shadow:
    inset 0 0 0 1px rgba(255, 77, 21, 0.45),
    0 18px 40px -20px rgba(0, 0, 0, 0.6),
    0 0 60px -30px rgba(255, 77, 21, 0.35);
}
.link:hover::after { opacity: 1; }

.link-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 77, 21, 0.10);
  color: var(--accent-solid);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.30);
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  transition: background 280ms, box-shadow 280ms;
}
.link:hover .link-icon {
  background: rgba(255, 77, 21, 0.16);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.55);
}

.link-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.link-label {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.link-sub {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link-arrow {
  color: var(--mute);
  font-family: var(--f-display);
  font-size: 18px;
  transition: color 200ms cubic-bezier(.2,.7,.2,1), transform 200ms cubic-bezier(.2,.7,.2,1);
}
.link:hover .link-arrow {
  color: var(--accent-solid);
  transform: translateX(4px);
}

.foot {
  margin-top: 32px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
  text-align: center;
}

/* Cinematic entrance */
@keyframes cardrise {
  from { opacity: 0; transform: translateY(20px); filter: blur(8px); }
  to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
}
.logo, .logo-rule, .name, .role, .divider, .links .link, .foot {
  animation: cardrise 900ms cubic-bezier(.2,.7,.2,1) both;
}
.logo       { animation-delay:  80ms; }
.logo-rule  { animation-delay: 180ms; }
.name       { animation-delay: 260ms; }
.role       { animation-delay: 380ms; }
.divider    { animation-delay: 480ms; }
.links .link:nth-child(1) { animation-delay: 540ms; }
.links .link:nth-child(2) { animation-delay: 620ms; }
.links .link:nth-child(3) { animation-delay: 700ms; }
.links .link:nth-child(4) { animation-delay: 780ms; }
.foot       { animation-delay: 900ms; }

@media (prefers-reduced-motion: reduce) {
  .logo, .logo-rule, .name, .role, .divider, .links .link, .foot {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }
}
    </style>
  </head>

    <script>
      // Cursor-tracking spotlight on each link
      document.querySelectorAll(".link").forEach((el) => {
        el.addEventListener("mousemove", (e) => {
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", (e.clientX - r.left) + "px");
          el.style.setProperty("--my", (e.clientY - r.top) + "px");
        });
      });
    </script>
