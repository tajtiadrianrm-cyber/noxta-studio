    <style>
/* =========================================================
   Noxta Studio v3 — Home
   Squared/tech display · sharp corners · gradient accents
   ========================================================= */

:root {
  /* palette — Obsidian Kinetic (dark + vibrant orange) */
  --bg: #0a0a0a;
  --bg-soft: #121414;
  --bg-tint: #1a1c1c;
  --ink: #f5f6f7;
  --ink-soft: #cfcccb;
  --mute: #8a8786;
  --faint: #3a3838;
  --hairline: rgba(255, 255, 255, 0.08);
  --hairline-soft: rgba(255, 255, 255, 0.04);

  /* accents — orange only (purple/cyan retired) */
  --cyan: #ff7a3d;
  --violet: #ff4d15;
  --pink: #d63a0d;

  /* derived accent (changeable via Tweaks) */
  --accent: linear-gradient(100deg, #ff7a3d 0%, #ff4d15 50%, #d63a0d 100%);
  --accent-solid: #ff4d15;
  --accent-glow: rgba(255, 77, 21, 0.5);

  /* type — Orbitron (display, futuristic) + Manrope (body) */
  --f-display: "Orbitron", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;

  /* shape */
  --notch: 10px;
  --notch-lg: 18px;

  /* layout */
  --pad-x: clamp(20px, 4vw, 64px);
  --max-w: 1440px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}
html,
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
}

/* ──────────────── Focus + reduced motion (a11y) ──────────────── */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent-solid);
  outline-offset: 3px;
  border-radius: 2px;
}
a:focus-visible,
button:focus-visible,
.btn:focus-visible {
  outline: 2px solid var(--accent-solid);
  outline-offset: 4px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: auto;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.skip-link:focus {
  position: fixed;
  left: 16px;
  top: 16px;
  width: auto;
  height: auto;
  padding: 12px 18px;
  background: var(--accent-solid);
  color: var(--bg);
  font-family: var(--f-body);
  font-weight: 700;
  text-decoration: none;
  border-radius: 4px;
  z-index: 9999;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ──────────────── Entrance animations (CSS-only stagger) ──────────────── */
@keyframes nx-rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes nx-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes nx-reveal {
  from { opacity: 0; transform: translateY(28px); filter: blur(10px); }
  to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
}
@keyframes nx-zoom-in {
  from { opacity: 0; transform: scale(1.06); filter: blur(6px); }
  to   { opacity: 1; transform: scale(1);    filter: blur(0); }
}

/* Hero — cinematic entrance, total ~0.8s (halved) */
.hero-text > * {
  animation: nx-reveal 500ms cubic-bezier(.2,.7,.2,1) both;
}
.hero-text > *:nth-child(1) { animation-delay: 75ms; }
.hero-text > *:nth-child(2) { animation-delay: 250ms; }
.hero-text > *:nth-child(3) { animation-delay: 350ms; }
.hero-text > *:nth-child(4) { animation-delay: 475ms; }
.hero-text > *:nth-child(5) { animation-delay: 625ms; }
.hero-portrait {
  animation: nx-zoom-in 800ms cubic-bezier(.2,.7,.2,1) both;
  animation-delay: 100ms;
}
.hero-status-pill { animation: nx-fade 450ms ease-out both; animation-delay: 700ms; }
.hero-top-meta    { animation: nx-fade 450ms ease-out both; animation-delay: 750ms; }
.hero-tagbar      { animation: nx-fade 450ms ease-out both; animation-delay: 850ms; }

/* Below-the-fold — start hidden, animate when parent section enters viewport */
.section .section-label,
.section .section-h,
.section .section-sub,
.service,
.work-card,
.pricing-toggle,
.believe-cell,
.price {
  opacity: 0;
  transform: translateY(28px);
  filter: blur(8px);
  transition:
    opacity 800ms cubic-bezier(.2,.7,.2,1),
    transform 320ms cubic-bezier(.2,.7,.2,1),
    filter 800ms cubic-bezier(.2,.7,.2,1);
}

.nx-in-view .section-label,
.nx-in-view .section-h,
.nx-in-view .section-sub,
.nx-in-view .service,
.nx-in-view .work-card,
.nx-in-view .pricing-toggle,
.nx-in-view .believe-cell,
.nx-in-view .price {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}

/* Stagger within each section */
.nx-in-view .section-h   { transition-delay: 100ms; }
.nx-in-view .section-sub { transition-delay: 200ms; }
.nx-in-view .pricing-toggle { transition-delay: 220ms; }

.nx-in-view .service:nth-child(1) { transition-delay: 240ms; }
.nx-in-view .service:nth-child(2) { transition-delay: 340ms; }
.nx-in-view .service:nth-child(3) { transition-delay: 440ms; }
.nx-in-view .service:nth-child(4) { transition-delay: 540ms; }

.nx-in-view .believe-cell:nth-child(1) { transition-delay: 240ms; }
.nx-in-view .believe-cell:nth-child(2) { transition-delay: 360ms; }
.nx-in-view .believe-cell:nth-child(3) { transition-delay: 480ms; }

.nx-in-view .price:nth-child(1) { transition-delay: 320ms; }
.nx-in-view .price:nth-child(2) { transition-delay: 440ms; }
.nx-in-view .price:nth-child(3) { transition-delay: 560ms; }

.nx-in-view .work-card { transition-delay: 240ms; }

@media (prefers-reduced-motion: reduce) {
  .section .section-label,
  .section .section-h,
  .section .section-sub,
  .service,
  .work-card,
  .pricing-toggle,
  .believe-cell,
  .price {
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
    transition: none !important;
  }
}

/* Subtle ambient noise grain */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.5;
  mix-blend-mode: screen;
}

a {
  color: inherit;
  text-decoration: none;
}
img {
  display: block;
  max-width: 100%;
}

/* ──────────────── Reusable shapes ──────────────── */

/* notch-cut corners (Portilo-esque tech edge) — replaces rounding */
.notch {
  clip-path: polygon(
    var(--notch) 0,
    100% 0,
    100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,
    0 100%,
    0 var(--notch)
  );
}

.notch-lg {
  clip-path: polygon(
    var(--notch-lg) 0,
    100% 0,
    100% calc(100% - var(--notch-lg)),
    calc(100% - var(--notch-lg)) 100%,
    0 100%,
    0 var(--notch-lg)
  );
}

/* Panel = sharp dark surface with hairline border via box-shadow inset
   (border-radius is 0; using inset shadow avoids visible corner doubling with clip-path) */
.panel {
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--hairline);
}

.hair-top {
  border-top: 1px solid var(--hairline);
}
.hair-bottom {
  border-bottom: 1px solid var(--hairline);
}

/* gradient text */
.grad {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* mono label */
.label {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--mute);
}
.label .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--cyan);
  margin-right: 8px;
  vertical-align: 2px;
  box-shadow: 0 0 8px var(--cyan);
}

/* ──────────────── Buttons ──────────────── */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  padding: 16px 24px;
  border: 0;
  cursor: pointer;
  position: relative;
  transition: transform 120ms ease, filter 120ms ease;
}
.btn:hover {
  transform: translateY(-1px);
}
.btn:active {
  transform: translateY(0);
}

.btn-primary {
  color: #08091a;
  background: var(--accent);
  clip-path: polygon(
    12px 0,
    100% 0,
    100% calc(100% - 12px),
    calc(100% - 12px) 100%,
    0 100%,
    0 12px
  );
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 20px 40px -20px var(--accent-glow);
}
.btn-primary:hover {
  filter: brightness(1.08);
}

.btn-ghost {
  color: var(--ink);
  background: transparent;
  position: relative;
  clip-path: polygon(
    12px 0,
    100% 0,
    100% calc(100% - 12px),
    calc(100% - 12px) 100%,
    0 100%,
    0 12px
  );
  transition: transform 120ms ease, filter 120ms ease, color 180ms;
}
.btn-ghost::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.04);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  z-index: -1;
  clip-path: inherit;
  transition: background 180ms, box-shadow 180ms;
}
.btn-ghost:hover {
  color: var(--accent-solid);
}
.btn-ghost:hover::before {
  background: rgba(255, 77, 21, 0.08);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.55);
}

/* ──────────────── Layout container ──────────────── */

.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding-left: var(--pad-x);
  padding-right: var(--pad-x);
  position: relative;
  z-index: 2;
}

section {
  position: relative;
  z-index: 2;
}

/* ──────────────── NAV ──────────────── */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px) saturate(120%);
  background: rgba(5, 6, 14, 0.65);
  border-bottom: 1px solid var(--hairline);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}
.nav-logo {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: 0 4px;
}
.nav-logo .x {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-style: italic;
  padding: 0 1px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.nav-links a {
  padding: 10px 16px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  color: var(--ink-soft);
  transition: color 150ms;
}
.nav-links a:hover {
  color: var(--ink);
}
.nav-links a[aria-current="page"] {
  color: var(--ink);
}
.nav-cta[aria-current="page"] {
  background: rgba(255, 77, 21, 0.20);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.65);
}
.nav-cta {
  margin-left: 8px;
  padding: 12px 18px !important;
  background: rgba(255, 77, 21, 0.10);
  color: var(--ink) !important;
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.35);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  transition: background 180ms, box-shadow 180ms;
}
.nav-cta:hover {
  background: rgba(255, 77, 21, 0.18);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.55);
  color: var(--ink) !important;
}

/* ──────────────── HERO (Portilo split layout: text · big portrait · meta) ──────────────── */

.hero {
  position: relative;
  min-height: calc(100vh - 72px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 35% 40% at 75% 30%, rgba(255, 77, 21, 0.14), transparent 70%),
    radial-gradient(ellipse 25% 30% at 18% 20%, rgba(255, 122, 61, 0.08), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.hero-top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px var(--pad-x) 0;
}
.hero-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  background: rgba(255, 77, 21, 0.10);
  color: var(--cyan);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  white-space: nowrap;
}
.hero-status-pill .pulse {
  width: 6px;
  height: 6px;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  position: relative;
  flex-shrink: 0;
}
.hero-status-pill .pulse::after {
  content: "";
  position: absolute;
  inset: -3px;
  border: 1px solid var(--cyan);
  animation: pulse-ring 1.8s infinite ease-out;
}
@keyframes pulse-ring {
  0% { transform: scale(0.7); opacity: 1; }
  100% { transform: scale(2.2); opacity: 0; }
}
.hero-top-meta {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
}

/* the body: 2-column grid — text + big portrait */
.hero-body {
  flex: 1;
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 0.95fr 1.6fr;
  gap: 32px;
  padding: 32px var(--pad-x) 0;
  align-items: stretch;
  min-height: 720px;
}
.hero-body::before,
.hero-body::after {
  content: "+";
  position: absolute;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--accent-solid);
  line-height: 1;
  z-index: 4;
}
.hero-body::before { top: 24px; left: calc(var(--pad-x) - 10px); }
.hero-body::after  { bottom: 24px; right: calc(var(--pad-x) - 10px); }
@media (max-width: 960px) {
  .hero-body {
    grid-template-columns: 1fr;
    gap: 24px;
    padding-top: 24px;
  }
}

.hero-text {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-top: 110px;
  max-width: 560px;
  z-index: 3;
  position: relative;
}
.hero-name {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(44px, 5.6vw, 92px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.hero-name .grad {
  display: inline-block;
}
.hero-name .dot {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-role-line {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 14px;
}
.hero-role-line .dash {
  width: 24px;
  height: 1px;
  background: var(--accent);
  display: block;
  flex-shrink: 0;
}
.hero-rule {
  border: 0;
  height: 1px;
  background: var(--hairline);
  margin: 8px 0 4px;
}
.hero-bio {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-soft);
  max-width: 38ch;
  text-wrap: pretty;
}
.hero-bio strong {
  color: var(--ink);
  font-weight: 600;
}
.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.hero-specs {
  margin-top: 32px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--hairline);
  box-shadow: 0 0 0 1px var(--hairline);
  max-width: 480px;
}
@media (max-width: 760px) {
  .hero-specs { grid-template-columns: 1fr; }
}
.hero-spec {
  background: var(--bg);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-spec .k {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
}
.hero-spec .v {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-transform: uppercase;
}
.hero-spec .v .accent { color: var(--accent-solid); }

/* center: the big portrait, fills the right column with a strong vertical presence */
.hero-portrait {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: visible;
}
.hero-portrait img {
  display: block;
  width: 100%;
  height: clamp(560px, 78vh, 880px);
  object-fit: cover;
  object-position: center 22%;
  filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6));
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
}
/* subtle glow behind the head (upper portion), not under the clothes */
.hero-portrait::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8%;
  width: 55%;
  height: 40%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, var(--accent-glow), transparent 70%);
  filter: blur(60px);
  opacity: 0.5;
  z-index: -1;
  pointer-events: none;
}

/* right: aside info stack */
.hero-aside {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
  justify-content: flex-start;
  padding-top: 24px;
  z-index: 3;
  position: relative;
}
.hero-badge {
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--hairline);
  padding: 16px 20px;
  min-width: 200px;
  text-align: right;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.hero-badge .k {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 8px;
}
.hero-badge .v {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.005em;
  color: var(--ink);
  line-height: 1;
}
.hero-badge .s {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 8px;
}
.hero-badge.accent {
  background: linear-gradient(140deg, rgba(255, 122, 61, 0.12), rgba(255, 77, 21, 0.12) 50%, rgba(214, 58, 13, 0.10));
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.35);
}
.hero-badge.accent .v {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* tagline strip below */
.hero-tagbar {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 22px var(--pad-x);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(11px, 1.1vw, 14px);
  letter-spacing: 0.12em;
  line-height: 1.4;
  text-transform: uppercase;
  color: var(--ink-soft);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  background: rgba(5, 6, 14, 0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hero-tagbar .dash {
  color: var(--mute);
  margin: 0 12px;
}

/* hero info bar across the bottom */
.hero-stat-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  position: relative;
  z-index: 3;
  background: rgba(5, 6, 14, 0.6);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hairline);
}
.hero-stat {
  padding: 16px var(--pad-x);
  border-right: 1px solid var(--hairline);
}
.hero-stat:last-child { border-right: 0; }
.hero-stat .k {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
}
.hero-stat .v {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--ink);
  margin-top: 6px;
}
@media (max-width: 760px) {
  .hero-stat-bar { grid-template-columns: repeat(2, 1fr); }
  .hero-aside { align-items: flex-start; }
  .hero-portrait { min-height: 360px; }
  .hero-portrait img { max-width: 100%; }
  .hero-top-meta { display: none; }
}

/* ──────────────── Spec bar divider ──────────────── */

.spec-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  background: rgba(0, 0, 0, 0.45);
  position: relative;
  z-index: 4;
}
.spec-bar .cell {
  padding: 22px var(--pad-x);
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.spec-bar .cell:last-child { border-right: 0; }
.spec-bar .k {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
}
.spec-bar .v {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-transform: uppercase;
}
.spec-bar .v .accent { color: var(--accent-solid); }

@media (max-width: 760px) {
  .spec-bar { grid-template-columns: repeat(2, 1fr); }
  .spec-bar .cell:nth-child(2) { border-right: 0; }
  .spec-bar .cell:nth-child(1),
  .spec-bar .cell:nth-child(2) { border-bottom: 1px solid var(--hairline); }
}

/* ──────────────── Marquee divider ──────────────── */

.marquee {
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  padding: 22px 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 4;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%);
}
.marquee-track {
  display: flex;
  width: max-content;
  align-items: center;
  gap: 48px;
  padding-left: 24px;
  animation: marquee-scroll 60s linear infinite;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(14px, 1.3vw, 18px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  white-space: nowrap;
}
.marquee-item {
  display: inline-flex;
  align-items: center;
  gap: 48px;
}
.marquee-item::after {
  content: "✺";
  color: var(--accent-solid);
  font-family: var(--f-mono);
  font-size: 0.85em;
}
@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .marquee-track { animation: none; }
}

/* ──────────────── Static strip divider ──────────────── */

.strip {
  position: relative;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  padding: 26px var(--pad-x);
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 4;
}
.strip-mark {
  color: var(--accent-solid);
  font-family: var(--f-mono);
  font-size: 0.9em;
  line-height: 1;
}
.strip-text {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(14px, 1.4vw, 20px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
}

/* ──────────────── Section atmosphere (corner glows) ──────────────── */

#about {
  background: radial-gradient(
    ellipse 90% 90% at 100% 0%,
    rgba(255, 77, 21, 0.10) 0%,
    rgba(255, 77, 21, 0.04) 25%,
    rgba(255, 77, 21, 0.015) 55%,
    transparent 100%
  );
}

#services {
  background: radial-gradient(
    ellipse 90% 95% at 0% 100%,
    rgba(255, 77, 21, 0.09) 0%,
    rgba(255, 77, 21, 0.035) 25%,
    rgba(255, 77, 21, 0.012) 55%,
    transparent 100%
  );
}

#believe {
  background: radial-gradient(
    ellipse 90% 90% at 100% 0%,
    rgba(255, 77, 21, 0.10) 0%,
    rgba(255, 77, 21, 0.04) 25%,
    rgba(255, 77, 21, 0.015) 55%,
    transparent 100%
  );
}

#pricing {
  background: radial-gradient(
    ellipse 95% 90% at 0% 100%,
    rgba(255, 77, 21, 0.07) 0%,
    rgba(255, 77, 21, 0.03) 30%,
    rgba(255, 77, 21, 0.01) 60%,
    transparent 100%
  );
}

.footer {
  background: radial-gradient(
    ellipse 100% 80% at 50% 0%,
    rgba(255, 77, 21, 0.08) 0%,
    rgba(255, 77, 21, 0.03) 35%,
    rgba(255, 77, 21, 0.01) 65%,
    transparent 100%
  );
}

/* ──────────────── Scroll cue ──────────────── */

.scroll-cue {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--accent-solid);
  z-index: 4;
  text-decoration: none;
  animation: scroll-bob 2s ease-in-out infinite;
}
.scroll-cue:hover { color: var(--ink); }
.scroll-cue .scroll-arrow {
  width: 24px;
  height: 22px;
  position: relative;
}
.scroll-cue .scroll-arrow::before,
.scroll-cue .scroll-arrow::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  left: 50%;
  border-right: 1.6px solid currentColor;
  border-bottom: 1.6px solid currentColor;
  transform: translateX(-50%) rotate(45deg);
}
.scroll-cue .scroll-arrow::before { top: -4px; opacity: 0.5; }
.scroll-cue .scroll-arrow::after  { top: 4px; }
@keyframes scroll-bob {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, 6px); }
}
@media (prefers-reduced-motion: reduce) {
  .scroll-cue { animation: none; }
}

/* ──────────────── Section header ──────────────── */

.section {
  padding-top: 80px;
  padding-bottom: 80px;
}
.section-label {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
}
.section-label .bar {
  width: 36px;
  height: 1px;
  background: var(--accent);
}
.section-label span {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
}
.section-h {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(40px, 6vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  max-width: 18ch;
}
.section-sub {
  font-size: 18px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-top: 18px;
  max-width: 54ch;
  text-wrap: pretty;
}

/* ──────────────── WHAT I DO (services list) ──────────────── */

.services {
  margin-top: 56px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
  position: relative;
}
.services::before,
.services::after {
  content: "+";
  position: absolute;
  top: -8px;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--accent-solid);
  line-height: 1;
}
.services::before { left: -10px; }
.services::after  { right: -10px; }
.service {
  position: relative;
  display: grid;
  grid-template-columns: 60px minmax(300px, 1.6fr) minmax(220px, 1.3fr) minmax(160px, 0.9fr) 40px;
  gap: 40px;
  align-items: center;
  padding: 28px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  cursor: pointer;
  transition: padding 220ms ease, background 220ms ease;
  overflow: hidden;
}
.service:hover {
  padding-left: 16px;
  background: rgba(255, 77, 21, 0.025);
}
.service::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 0;
  background: var(--accent);
  transition: height 220ms ease;
  z-index: 2;
}
.service:hover::before {
  height: 60%;
}
.service-bg {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(90px, 11vw, 150px);
  line-height: 0.8;
  letter-spacing: 0;
  color: rgba(255, 77, 21, 0.11);
  pointer-events: none;
  z-index: 0;
  transition:
    color 380ms cubic-bezier(.2,.7,.2,1),
    transform 420ms cubic-bezier(.2,.7,.2,1),
    filter 380ms cubic-bezier(.2,.7,.2,1);
}
.service-bg span {
  display: inline-block;
  width: 0.78em;
  text-align: center;
}
.service:hover .service-bg {
  color: rgba(255, 77, 21, 0.38);
  transform: translateY(-50%) translateX(-12px);
  filter: drop-shadow(0 0 60px rgba(255, 77, 21, 0.28));
}
.service > *:not(.service-bg) { position: relative; z-index: 1; }
.service .num {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--mute);
}
.service .title {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(26px, 3.2vw, 48px);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  white-space: nowrap;
  transition: color 200ms;
}
.service:hover .title {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.service .tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--mute);
}
.service .tags span {
  padding: 5px 10px;
  background: rgba(255, 255, 255, 0.04);
  box-shadow: inset 0 0 0 1px var(--hairline);
}
.service .desc {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
  max-width: 36ch;
}
.service .arr {
  font-family: var(--f-display);
  color: var(--mute);
  transition: color 200ms, transform 200ms;
}
.service:hover .arr {
  color: var(--ink);
  transform: translateX(6px);
}

/* ──────────────── FEATURED WORK (VOEP) ──────────────── */

.work-card {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 0;
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--hairline);
  overflow: hidden;
  margin-top: 56px;
}
.work-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse 110% 90% at 80% 50%,
      rgba(255, 122, 61, 0.18) 0%,
      rgba(255, 122, 61, 0.08) 25%,
      rgba(255, 122, 61, 0.025) 55%,
      transparent 100%
    ),
    radial-gradient(
      ellipse 90% 80% at 20% 100%,
      rgba(214, 58, 13, 0.13) 0%,
      rgba(214, 58, 13, 0.045) 30%,
      transparent 100%
    );
  pointer-events: none;
  z-index: 0;
}
.work-card > * { position: relative; z-index: 1; }
@media (max-width: 960px) {
  .work-card { grid-template-columns: 1fr; }
}
.work-info {
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.work-tag {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mute);
}
.work-title {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(48px, 6vw, 100px);
  letter-spacing: -0.01em;
  line-height: 1;
  text-transform: uppercase;
}
.work-sub {
  font-size: 18px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.work-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--hairline);
  margin-top: auto;
}
.work-meta .cell {
  background: var(--bg-soft);
  padding: 16px;
}
.work-meta .k {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
}
.work-meta .v {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 18px;
  color: var(--ink);
  margin-top: 6px;
}
.work-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.work-vis {
  position: relative;
  min-height: 480px;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  overflow: hidden;
}

/* VOEP browser-window frame around the real site screenshot */
.browser {
  display: block;
  position: relative;
  width: 100%;
  max-width: 620px;
  background: #0a0e1a;
  color: inherit;
  text-decoration: none;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 80px -20px rgba(0, 0, 0, 0.7);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: transform 280ms cubic-bezier(.2,.7,.2,1), box-shadow 280ms;
}
.browser:hover {
  transform: translateY(-4px);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.45),
              0 40px 90px -20px rgba(0, 0, 0, 0.85),
              0 20px 60px -20px rgba(255, 77, 21, 0.20);
}
.browser-shot {
  display: block;
  width: 100%;
  height: auto;
}
.browser-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--mute);
}
.browser-bar .dot {
  width: 8px;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 50%; /* lights only — fine */
}
.browser-bar .url {
  margin-left: 12px;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.04);
  font-size: 10px;
  letter-spacing: 0.05em;
}
.browser-body {
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.voep-mast {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.voep-logo {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.voep-logo .ring {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  position: relative;
}
.voep-logo .ring::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--ink);
  border-radius: 50%;
}
.voep-nav {
  display: flex;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
}
.voep-h {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 28px;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: -0.01em;
}
.voep-h em {
  font-style: normal;
  background: linear-gradient(90deg, #ff7a3d, #ffaa55);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.voep-yrs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-top: 4px;
}
.voep-yr {
  font-family: var(--f-mono);
  font-size: 8px;
  color: var(--mute);
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
}
.voep-yr .y {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 11px;
  color: #ff7a3d;
}
.voep-line {
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
  margin: 10px 0;
}
.voep-quote {
  font-family: "Georgia", serif;
  font-style: italic;
  font-size: 9px;
  line-height: 1.5;
  color: var(--ink-soft);
  padding: 8px 12px;
  border-left: 2px solid var(--mute);
}

/* ──────────────── BELIEVE strip ──────────────── */

.believe {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 56px;
  position: relative;
}
.believe::before,
.believe::after {
  content: "+";
  position: absolute;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--accent-solid);
  line-height: 1;
}
.believe::before { top: -10px; left: -10px; }
.believe::after  { bottom: -10px; right: -10px; }
@media (max-width: 800px) {
  .believe { grid-template-columns: 1fr; gap: 16px; }
}
.believe-cell {
  --mx: 50%;
  --my: 50%;
  background: var(--bg-soft);
  padding: 44px 32px 40px;
  box-shadow: inset 0 0 0 1px var(--hairline);
  position: relative;
  overflow: hidden;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  transition:
    transform 320ms cubic-bezier(.2,.7,.2,1),
    box-shadow 320ms cubic-bezier(.2,.7,.2,1),
    background-color 320ms;
  cursor: default;
}
/* Cursor-following spotlight — applied to all interactive cards */
.believe-cell::after,
.service::after,
.work-card::after,
.price::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    320px circle at var(--mx, 50%) var(--my, 50%),
    rgba(255, 77, 21, 0.22),
    rgba(255, 77, 21, 0) 70%
  );
  opacity: 0;
  transition: opacity 280ms cubic-bezier(.2,.7,.2,1);
  z-index: 2;
  mix-blend-mode: screen;
}
.believe-cell:hover::after,
.service:hover::after,
.work-card:hover::after,
.price:hover::after { opacity: 1; }
.service, .work-card, .price { --mx: 50%; --my: 50%; }
.believe-cell:hover {
  transform: translateY(-6px) scale(1.02);
  background-color: rgba(255, 77, 21, 0.04);
  box-shadow:
    inset 0 0 0 1px rgba(255, 77, 21, 0.40),
    0 24px 50px -20px rgba(0, 0, 0, 0.7),
    0 0 80px -30px rgba(255, 77, 21, 0.45);
}
.believe-cell:hover .believe-bg {
  color: rgba(255, 77, 21, 0.38);
  transform: translateX(-8px);
  filter: drop-shadow(0 0 60px rgba(255, 77, 21, 0.28));
}
.believe-bg {
  transition:
    color 380ms cubic-bezier(.2,.7,.2,1),
    transform 420ms cubic-bezier(.2,.7,.2,1),
    filter 380ms cubic-bezier(.2,.7,.2,1);
}
.believe-bg {
  position: absolute;
  right: 16px;
  bottom: -10px;
  display: flex;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(120px, 13vw, 200px);
  line-height: 0.8;
  letter-spacing: 0;
  color: rgba(255, 77, 21, 0.11);
  pointer-events: none;
  z-index: 0;
}
.believe-bg span {
  display: inline-block;
  width: 0.78em;
  text-align: center;
}
.believe-cell > *:not(.believe-bg) { position: relative; z-index: 1; }
.believe-cell .n {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--accent-solid);
  margin-bottom: 18px;
}
.believe-cell h3 {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(28px, 2.8vw, 42px);
  line-height: 0.95;
  text-transform: uppercase;
  margin-bottom: 14px;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.believe-cell p {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.6;
}

/* ──────────────── PRICING ──────────────── */

.pricing-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
  flex-wrap: wrap;
}
.pricing-toggle {
  display: inline-flex;
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--hairline);
  padding: 4px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
.pricing-toggle button {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 12px 22px;
  background: transparent;
  border: 0;
  color: var(--mute);
  cursor: pointer;
  position: relative;
  transition: color 180ms;
}
.pricing-toggle button.active {
  color: #08091a;
  background: var(--accent);
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}
.pricing-toggle button:not(.active):hover {
  color: var(--ink);
}

.pricing-grid {
  display: grid;
  grid-template-columns: 1fr 1.12fr 1fr;
  gap: 16px;
  margin-top: 48px;
  align-items: stretch;
  position: relative;
}
.pricing-grid::before,
.pricing-grid::after {
  content: "+";
  position: absolute;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--accent-solid);
  line-height: 1;
}
.pricing-grid::before { top: -14px; left: -10px; }
.pricing-grid::after  { bottom: -14px; right: -10px; }
@media (max-width: 900px) {
  .pricing-grid { grid-template-columns: 1fr; }
}
.price {
  position: relative;
  background: var(--bg-soft);
  padding: 36px 28px 32px;
  display: flex;
  flex-direction: column;
  box-shadow: inset 0 0 0 1px var(--hairline);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  transition:
    transform 320ms cubic-bezier(.2,.7,.2,1),
    box-shadow 320ms cubic-bezier(.2,.7,.2,1),
    background-color 320ms;
}
.price > * { position: relative; z-index: 1; }
.price {
  will-change: transform;
  transform-style: preserve-3d;
}
.price > * { transform-style: preserve-3d; }
.price-flag { transform: translateZ(50px); }
.price-name { transform: translateZ(40px); }
.price-head { transform: translateZ(20px); }
.price-desc,
.price-feat-label,
.price-list { transform: translateZ(15px); }
.price-foot { transform: translateZ(8px); }
.price:hover {
  background-color: rgba(255, 77, 21, 0.04);
  box-shadow:
    inset 0 0 0 1px rgba(255, 77, 21, 0.40),
    0 30px 60px -20px rgba(0, 0, 0, 0.7),
    0 0 90px -30px rgba(255, 77, 21, 0.50);
}
.price:hover .price-name {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.price.featured:hover {
  box-shadow:
    inset 0 0 0 1px rgba(255, 77, 21, 0.65),
    0 40px 80px -20px rgba(0, 0, 0, 0.8),
    0 0 110px -30px rgba(255, 77, 21, 0.55);
}
.pricing-grid { perspective: 1000px; }
.price-name { transition: color 320ms; }
.price-list li::before { transition: transform 240ms cubic-bezier(.2,.7,.2,1); }
.price:hover .price-list li::before { transform: translateX(2px) scale(1.15); }
.price.featured {
  background: linear-gradient(180deg, rgba(255, 77, 21, 0.14) 0%, rgba(255, 122, 61, 0.06) 50%, rgba(214, 58, 13, 0.08) 100%), var(--bg-soft);
  box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.45),
              0 30px 60px -20px rgba(255, 77, 21, 0.18);
  z-index: 2;
}
.price-flag {
  position: absolute;
  top: -1px;
  left: 16px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #08091a;
  background: var(--accent);
  padding: 6px 12px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 6px 100%);
}
.price-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 14px;
  margin-bottom: 22px;
  margin-top: 6px;
}
.price-head .amt {
  color: var(--ink);
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: 0.04em;
  font-size: 11px;
}
.price-name {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(36px, 3.5vw, 48px);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
}
.price-desc {
  font-style: normal;
  color: var(--ink-soft);
  font-size: 14px;
  margin-bottom: 24px;
}
.price-feat-label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 14px;
}
.price-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 14px;
  color: var(--ink-soft);
  flex: 1;
}
.price-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  line-height: 1.45;
}
.price-list li::before {
  content: "+";
  color: var(--cyan);
  font-family: var(--f-display);
  font-weight: 700;
  flex-shrink: 0;
  width: 14px;
  text-align: center;
}
.price.featured .price-list li::before {
  color: var(--violet);
}
.price-foot {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--hairline);
  font-size: 13px;
  color: var(--mute);
  line-height: 1.5;
}
.price-foot .ideal {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mute);
  display: block;
  margin-bottom: 8px;
}

/* ──────────────── CTA (Portilo-style with portrait + wordmark behind) ──────────────── */

.cta {
  position: relative;
  padding: 0;
  margin-top: 0;
  overflow: hidden;
  background: var(--bg-soft);
  box-shadow: inset 0 0 0 1px var(--hairline);
}
.cta::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 80% 100% at 50% 100%,
    rgba(255, 77, 21, 0.14),
    transparent 80%
  );
  pointer-events: none;
}
.cta-inner {
  position: relative;
  padding: 64px var(--pad-x) 48px;
  min-height: 820px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.cta-top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 24px;
  align-items: start;
  z-index: 3;
  position: relative;
}
.cta-top .mark {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-soft);
  line-height: 1.55;
}
.cta-top .mark .sub { color: var(--mute); }
.cta-top .mark.tr { text-align: right; }

.cta-stage {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  margin-top: 16px;
  min-height: 560px;
}
.cta-h {
  position: relative;
  z-index: 4;
  text-align: center;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(64px, 10vw, 160px);
  line-height: 1;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  margin-bottom: 12px;
  white-space: nowrap;
}
.cta-h .grad { display: inline-block; }

.cta-wordmark {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  pointer-events: none;
  padding-top: 80px;
}
.cta-wordmark .glyph {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(180px, 36vw, 600px);
  line-height: 0.82;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  opacity: 0.55;
  white-space: nowrap;
}

.cta-photo-wrap {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  margin-top: auto;
}
.cta-photo {
  display: block;
  width: 100%;
  max-width: 720px;
  height: clamp(500px, 70vh, 800px);
  object-fit: cover;
  object-position: center 25%;
  filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.55));
  -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0, #000 82%, transparent 100%);
}

.cta-bottom {
  position: relative;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 14px;
  text-align: center;
}
.cta-bottom .lede {
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1.55;
  max-width: 52ch;
}
.cta-bottom .ctas {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.cta-bottom .note {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mute);
  margin-top: 6px;
}
.cta-bottom .note strong {
  color: var(--ink);
  font-family: var(--f-display);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.cta-bottom .note .note-link {
  transition: color 180ms;
}
.cta-bottom .note .note-link:hover strong {
  color: var(--accent-solid);
}

@media (max-width: 760px) {
  .cta-inner { padding: 48px 24px 32px; min-height: auto; }
  .cta-top { grid-template-columns: 1fr; }
  .cta-top .mark.tr { text-align: left; }
}

/* ──────────────── WORDMARK + FOOTER ──────────────── */

.wordmark {
  padding: 120px var(--pad-x) 40px;
  text-align: center;
  position: relative;
}
.wordmark .glyph {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: clamp(140px, 28vw, 460px);
  line-height: 0.85;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  opacity: 0.95;
  position: relative;
  display: inline-block;
}
.wordmark .glyph::after {
  content: "";
  position: absolute;
  inset: -20% -10%;
  background: var(--accent);
  filter: blur(80px);
  opacity: 0.15;
  z-index: -1;
}

.footer {
  border-top: 1px solid var(--hairline);
  padding-top: 60px;
  padding-bottom: 40px;
  position: relative;
}
.foot-grid {
  display: grid;
  grid-template-columns: 1.6fr 0.9fr 0.9fr 0.9fr;
  gap: 0;
  margin-bottom: 60px;
  position: relative;
}
.foot-col {
  padding: 4px 32px 4px 0;
  position: relative;
}
.foot-col + .foot-col {
  border-left: 1px solid var(--hairline);
  padding-left: 32px;
}
@media (max-width: 800px) {
  .foot-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  .foot-col, .foot-col + .foot-col { padding: 0; border-left: 0; }
}
.foot-col h4 {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent-solid);
  margin-bottom: 18px;
  font-weight: 400;
}
.foot-col a, .foot-col p {
  display: block;
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 10px;
  transition: color 150ms;
}
.foot-col a {
  display: flex;
  align-items: center;
  min-height: 44px;
  margin-bottom: 2px;
}
.foot-col a:hover { color: var(--ink); }
.foot-brand .lg {
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 32px;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
}
.foot-brand .lg .x {
  background: var(--accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-style: italic;
}
.foot-brand p {
  max-width: 32ch;
  font-size: 13px;
  color: var(--mute);
  line-height: 1.5;
}

.foot-base {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--hairline);
  padding-top: 24px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mute);
  gap: 24px;
  flex-wrap: wrap;
}
.foot-base .dots {
  display: flex;
  gap: 16px;
}
.foot-base .dots span {
  position: relative;
  padding-left: 14px;
}
.foot-base .dots span::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 5px;
  height: 5px;
  background: var(--cyan);
}

/* ──────────────── responsive ──────────────── */

@media (max-width: 760px) {
  /* ── Nav ── */
  .nav-links a:not(.nav-cta) { padding: 8px 10px; font-size: 11px; }
  .nav-cta { padding: 10px 14px !important; font-size: 11px; }
  .nav-inner { gap: 8px; }

  /* ── Hero ── */
  .hero { min-height: calc(100dvh - 72px); padding: 16px 0 0; }
  .hero-top { padding: 16px var(--pad-x); }
  .hero-top-meta { display: none; }
  .hero-body { padding: 16px var(--pad-x) 0; min-height: auto; gap: 16px; }
  .hero-text { padding-top: 16px; max-width: 100%; gap: 12px; }
  .hero-name { font-size: clamp(40px, 11vw, 60px); }
  .hero-bio { font-size: 14px; max-width: 100%; }
  .hero-actions { gap: 10px; }
  .hero-portrait img {
    height: clamp(380px, 58vh, 540px);
    max-width: 100%;
    object-position: center 12%;
    -webkit-mask-image: radial-gradient(ellipse 110% 90% at center 40%, #000 70%, transparent 100%);
    mask-image: radial-gradient(ellipse 110% 90% at center 40%, #000 70%, transparent 100%);
  }

  /* ── Sections (general) ── */
  .section { padding-top: 56px; padding-bottom: 56px; }
  .section-h { font-size: clamp(32px, 9vw, 52px); }
  .section-sub { font-size: 15px; }

  /* ── Hide decorative corner marks (often overflow on small screens) ── */
  .services::before, .services::after,
  .believe::before, .believe::after,
  .pricing-grid::before, .pricing-grid::after,
  .hero-body::before, .hero-body::after { display: none; }

  /* ── Services ── */
  .service { grid-template-columns: 50px 1fr; padding: 18px 0; gap: 16px; }
  .service .tags, .service .desc, .service .arr { display: none; }
  .service .title { font-size: clamp(24px, 7vw, 36px); }
  .service-bg { right: 0; font-size: clamp(72px, 22vw, 110px); }

  /* ── Work ── */
  .work-info, .work-vis { padding: 32px 24px; }
  .work-vis { min-height: auto; padding: 24px; }
  .work-title { font-size: clamp(44px, 12vw, 64px); }

  /* ── Marquee + static strip ── */
  .marquee { padding: 16px 0; }
  .marquee-track { font-size: 12px; gap: 32px; padding-left: 16px; }
  .marquee-item { gap: 32px; }
  .strip { padding: 20px var(--pad-x); gap: 14px; }
  .strip-text { font-size: 13px; letter-spacing: 0.14em; }

  /* ── Believe ── */
  .believe { gap: 14px; }
  .believe-cell { padding: 32px 24px 28px; }
  .believe-bg { font-size: clamp(90px, 26vw, 150px); }

  /* ── Pricing ── */
  .pricing-head { gap: 24px; }
  .price { padding: 30px 24px 28px; }
  .price-name { font-size: 38px; }
  .pricing-toggle button { padding: 10px 16px; font-size: 11px; letter-spacing: 0.1em; }

  /* ── CTA ── */
  .cta-inner { padding: 48px 24px 36px; min-height: auto; }
  .cta-h { font-size: clamp(48px, 14vw, 80px); }
  .cta-photo {
    height: clamp(380px, 58vh, 560px);
    max-width: 100%;
    object-position: center 12%;
    -webkit-mask-image: radial-gradient(ellipse 110% 90% at center 40%, #000 70%, transparent 100%);
    mask-image: radial-gradient(ellipse 110% 90% at center 40%, #000 70%, transparent 100%);
  }
  .cta-wordmark { padding-top: 60px; }
  .cta-wordmark .glyph { font-size: clamp(140px, 42vw, 320px); }
  .cta-top .mark { font-size: 10px; letter-spacing: 0.18em; }

  /* ── Spec bar ── */
  .spec-bar { grid-template-columns: repeat(2, 1fr); }
  .spec-bar .cell { padding: 18px var(--pad-x); }
  .spec-bar .cell:nth-child(2) { border-right: 0; }
  .spec-bar .cell:nth-child(1),
  .spec-bar .cell:nth-child(2) { border-bottom: 1px solid var(--hairline); }
  .spec-bar .v { font-size: 16px; }

  /* ── Wordmark ── */
  .wordmark { padding: 80px var(--pad-x) 30px; }

  /* ── Footer ── */
