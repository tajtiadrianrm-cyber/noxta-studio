<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Noxta Studio — N lettermark</title>
  <desc>Orange ember gradient rounded square with a stylised black N lettermark</desc>
  <defs>
    <!-- Noxta accent: light orange → orange → deep orange at 100deg -->
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff7a3d"/>
      <stop offset="50%"  stop-color="#ff4d15"/>
      <stop offset="100%" stop-color="#d63a0d"/>
    </linearGradient>
  </defs>

  <!-- Background — ember gradient -->
  <rect x="0" y="0" width="400" height="400" rx="72" fill="url(#ember)"/>

  <!-- N lettermark — bold geometric, near-black -->
  <rect    x="80"  y="96" width="52" height="208" rx="6"                         fill="#0a0a0a"/>
  <rect    x="268" y="96" width="52" height="208" rx="6"                         fill="#0a0a0a"/>
  <polygon points="132,96 188,96 268,304 212,304"                                fill="#0a0a0a"/>
</svg>
