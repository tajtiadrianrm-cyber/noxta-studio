<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noxta Studio · OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0a0a0a;
        color: #f5f6f7;
        font-family: "Manrope", system-ui, sans-serif;
        position: relative;
        isolation: isolate;
      }

      /* Atmospheric orange glows */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 60% at 90% 20%, rgba(255, 122, 61, 0.30), transparent 60%),
          radial-gradient(ellipse 50% 60% at 10% 90%, rgba(214, 58, 13, 0.22), transparent 60%);
        z-index: -1;
      }
      /* Noise texture */
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        opacity: 0.5;
        mix-blend-mode: screen;
        pointer-events: none;
        z-index: -1;
      }

      .wrap {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 460px;
        gap: 0;
      }

      /* Corner registration marks */
      .wrap::before,
      .wrap::after {
        content: "+";
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        color: #ff4d15;
        line-height: 1;
        z-index: 3;
      }
      .wrap::before { top: 40px; left: 40px; }
      .wrap::after { bottom: 40px; right: 40px; }

      .left {
        padding: 60px 40px 60px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        position: relative;
        z-index: 2;
      }

      .portrait {
        position: relative;
        overflow: hidden;
      }
      .portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 28%;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
                mask-image: linear-gradient(to right, transparent 0%, #000 26%, #000 100%);
      }
      .portrait::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 70% at 60% 30%, rgba(255, 77, 21, 0.22), transparent 60%);
        pointer-events: none;
        mix-blend-mode: screen;
      }

      /* Top row: logo + status */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .logo {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: 28px;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: baseline;
      }
      .logo .x {
        background: linear-gradient(100deg, #ff7a3d 0%, #ff4d15 50%, #d63a0d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-style: italic;
        padding: 0 1px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: rgba(255, 77, 21, 0.10);
        box-shadow: inset 0 0 0 1px rgba(255, 77, 21, 0.40);
        color: #ff4d15;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .status .dot {
        width: 6px;
        height: 6px;
        background: #ff4d15;
        box-shadow: 0 0 10px #ff4d15;
      }

      /* Main headline */
      .main {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .role {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #cfcccb;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .role .bar {
        width: 36px;
        height: 1px;
        background: linear-gradient(100deg, #ff7a3d 0%, #ff4d15 50%, #d63a0d 100%);
      }
      .headline {
        font-family: "Orbitron", sans-serif;
        font-weight: 900;
        font-size: 84px;
        line-height: 0.94;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .headline .grad {
        background: linear-gradient(100deg, #ff7a3d 0%, #ff4d15 50%, #d63a0d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
      }

      /* Bottom row */
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #cfcccb;
        gap: 16px;
      }
      .bottom .url {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 18px;
        color: #f5f6f7;
        text-transform: none;
      }
      .bottom .url .accent { color: #ff4d15; }
      .bottom .meta {
        text-align: right;
        line-height: 1.6;
      }
      .bottom .meta .k { color: #8a8786; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="left">
        <div class="top">
          <div class="logo">No<span class="x">x</span>ta Studio</div>
          <div class="status">
            <span class="dot"></span>
            Available · Q3 2026
          </div>
        </div>

        <div class="main">
          <div class="role">
            <span class="bar"></span>
            Adrian Tajti · Freelance web designer
          </div>
          <h1 class="headline">
            Built by hand,<br />
            <span class="grad">kept by hand.</span>
          </h1>
        </div>

        <div class="bottom">
          <div class="url">noxta<span class="accent">.</span>studio</div>
          <div class="meta">
            <div><span class="k">// Studio</span> · Tilburg, NL</div>
            <div><span class="k">// Est.</span> · 2026</div>
          </div>
        </div>
      </div>

      <div class="portrait">
        <img src="assets/portrait-hero.png" alt="Adrian Tajti" />
      </div>
    </div>
  </body>
</html>
